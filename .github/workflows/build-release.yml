name: Build & attach release assets

# Builds the static app, packages the Windows portable zip AND the signed
# Android APK, and attaches both to the current release.
on:
  push:
    branches:
      - arena/01a086ce-ghoststream
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: v2.2.0

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java (Android build)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Guard packaging files (ASCII + CRLF)
        run: |
          python3 - << 'PY'
          import sys
          for p in ["packaging/server.ps1", "packaging/Start-Ghoststream.bat", "packaging/README.txt"]:
              raw = open(p, "rb").read()
              raw.decode("ascii")  # raises on non-ASCII
              assert b"\n" not in raw.replace(b"\r\n", b""), f"{p}: stray LF"
              print("OK", p)
          PY

      - name: Package Windows portable
        run: |
          mkdir -p pkg/Ghoststream
          cp -r out/* pkg/Ghoststream/
          cp packaging/server.ps1 packaging/Start-Ghoststream.bat packaging/README.txt pkg/Ghoststream/
          cd pkg
          zip -r -q ../Ghoststream-${{ env.VERSION }}-Windows-Portable.zip Ghoststream
          cd ..
          unzip -l Ghoststream-${{ env.VERSION }}-Windows-Portable.zip | tail -3

      - name: Build signed Android APK (Capacitor)
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk \
             ../Ghoststream-${{ env.VERSION }}-Android.apk
          cd ..
          ls -la Ghoststream-${{ env.VERSION }}-Android.apk

      - name: Remove old assets if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete-asset "$VERSION" "Ghoststream-$VERSION-Windows-Portable.zip" \
            -R "$GITHUB_REPOSITORY" -y || echo "no existing zip asset (fine)"
          gh release delete-asset "$VERSION" "Ghoststream-$VERSION-Android.apk" \
            -R "$GITHUB_REPOSITORY" -y || echo "no existing apk asset (fine)"

      - name: Attach to ${{ env.VERSION }} release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            Ghoststream-${{ env.VERSION }}-Windows-Portable.zip
            Ghoststream-${{ env.VERSION }}-Android.apk
