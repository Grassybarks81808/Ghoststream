name: Build & attach release assets

# Builds the static app, packages the Windows portable zip, and attaches it
# to the v2.0.0 release. Runs on every push to the working branch.
on:
  push:
    branches:
      - arena/01a086ce-ghoststream
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Package Windows portable
        run: |
          mkdir -p pkg/Ghoststream
          cp -r out/* pkg/Ghoststream/
          cp packaging/server.ps1 packaging/Start-Ghoststream.bat packaging/README.txt pkg/Ghoststream/
          cd pkg
          zip -r -q ../Ghoststream-v2.0.0-Windows-Portable.zip Ghoststream
          cd ..
          unzip -l Ghoststream-v2.0.0-Windows-Portable.zip | tail -3

      - name: Attach to v2.0.0 release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          files: Ghoststream-v2.0.0-Windows-Portable.zip
